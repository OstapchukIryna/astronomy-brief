[project]
name = "astronomy-brief"
version = "0.1.0"
description = "Educational API for explaining NASA’s Astronomy Picture of the Day for non-experts using an LLM"
readme = "README.md"
authors = [{ name = "Iryna Ostapchuk", email = "Blue.hunde@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic[tz]>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pyrefly]
project-includes = ["app", "tests"]


[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pre-commit>=4.7.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
]

[tool.mutmut]
source_paths = ["app/"]
pytest_add_cli_args_test_selection = [
    "tests/domain",
    "tests/services",
    "tests/clients",
    "tests/test_config.py",
    "tests/api/test_errors.py",
    "tests/test_bootstrap.py",
]
