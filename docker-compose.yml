services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astronomy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U astro -d astronomy" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
